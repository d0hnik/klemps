[package]
name = "klemps-api"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-web-ratelimit = "0.1.2"
url = "2"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
typeshare = "1.0.5"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
